name: Release

# Pushing a tag such as v0.1.0 builds the Windows installer and a portable
# zip, and attaches both to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build app and installer
        run: npm run tauri build

      - name: Package portable build
        shell: pwsh
        run: |
          $name = "OpenLMI-${{ github.ref_name }}-portable"
          New-Item -ItemType Directory -Force "portable/OpenLMI/data" | Out-Null
          Copy-Item "src-tauri/target/release/openlmi.exe" "portable/OpenLMI/OpenLMI.exe"
          Copy-Item "LICENSE" "portable/OpenLMI/LICENSE.txt"
          # The data folder is what switches OpenLMI into portable mode.
          Set-Content "portable/OpenLMI/data/README.txt" "OpenLMI keeps its settings in this folder (portable mode). Delete the folder to use the normal per-user location instead."
          Compress-Archive -Path "portable/OpenLMI" -DestinationPath "$name.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openlmi-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            OpenLMI-*-portable.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            OpenLMI-*-portable.zip
