[package]
name = "openlmi"
version = "0.1.0"
description = "OpenLMI - Open Microcontroller LED Integration"
authors = ["Noxel43"]
license = "MIT"
repository = "https://github.com/Noxel43/OpenLMI"
edition = "2021"
default-run = "openlmi"

[lib]
name = "openlmi_lib"

[[bin]]
name = "openlmi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
xcap = "0.9"
cpal = "0.18"
rustfft = "6"
rhai = "1"
base64 = "0.22"
parking_lot = "0.12"
fastrand = "2"
chrono = "0.4"

# The render loop does per-LED maths every frame, so keep debug builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
